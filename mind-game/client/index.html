<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>🧠 MindBlaster</title>
    <style>
      @keyframes glitch { 0%, 100% { text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.8), -0.05em -0.025em 0 rgba(0, 100, 255, 0.8); } 25% { text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.8), 0.025em 0.025em 0 rgba(0, 100, 255, 0.8); } 50% { text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.8), 0.05em 0 0 rgba(0, 100, 255, 0.8); } 75% { text-shadow: -0.025em 0 0 rgba(255, 0, 0, 0.8), -0.025em -0.025em 0 rgba(0, 100, 255, 0.8); } }
      @keyframes filmGrain { 0%, 100% { opacity: 0.02; } 50% { opacity: 0.04; } }
      @keyframes rustPulse { 0%, 100% { box-shadow: inset 0 0 20px rgba(139, 0, 0, 0.3), 0 0 10px rgba(139, 0, 0, 0.2); } 50% { box-shadow: inset 0 0 30px rgba(139, 0, 0, 0.5), 0 0 15px rgba(139, 0, 0, 0.3); } }
      @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes celebrate { 0% { transform: scale(1) rotate(0deg); } 25% { transform: scale(1.1) rotate(5deg); } 75% { transform: scale(1.1) rotate(-5deg); } 100% { transform: scale(1) rotate(0deg); } }
      @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(5deg); } }
      @keyframes slideDown { from { opacity: 0; transform: translateX(-50%) translateY(-50px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
      @keyframes deathFade { 0% { transform: translate(-50%, -50%) scale(3); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
      @keyframes crossFade { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 50% { transform: scale(1.3) rotate(0deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
      
      * { box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        margin: 0;
        background: 
          linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 50%, #2a2a2a 100%),
          radial-gradient(ellipse at top, rgba(139, 0, 0, 0.15) 0%, transparent 50%),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 100px,
            rgba(0, 0, 0, 0.05) 100px,
            rgba(0, 0, 0, 0.05) 101px
          ),
          repeating-linear-gradient(
            0deg,
            transparent,
            transparent 100px,
            rgba(0, 0, 0, 0.03) 100px,
            rgba(0, 0, 0, 0.03) 101px
          );
        background-size: 100% 100%, 100% 100%, 200px 200px, 200px 200px;
        background-attachment: fixed;
        color: #f0f0f0;
        position: relative;
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 100vh;
        
        /* Heavy black vignette */
        &::before {
          content: '';
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
          pointer-events: none;
          z-index: 9999;
        }
        
        /* Film grain texture */
        &::after {
          content: '';
          position: fixed;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: 
            repeating-linear-gradient(
              0deg,
              rgba(255, 255, 255, 0.03),
              rgba(255, 255, 255, 0.03) 1px,
              transparent 1px,
              transparent 2px
            ),
            repeating-linear-gradient(
              90deg,
              rgba(255, 255, 255, 0.02),
              rgba(255, 255, 255, 0.02) 1px,
              transparent 1px,
              transparent 2px
            );
          pointer-events: none;
          z-index: 9998;
          animation: filmGrain 0.5s steps(10) infinite;
        }
      }
      
      #bg-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      
      #root {
        position: relative;
        z-index: 1;
      }
      
      .card {
        max-width: 1400px;
        margin: 40px auto;
        background: 
          linear-gradient(135deg, #3d3d3d, #2d2d2d),
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 10px,
            rgba(139, 0, 0, 0.08) 10px,
            rgba(139, 0, 0, 0.08) 11px
          );
        padding: 32px;
        border-radius: 4px;
        border: 3px solid #8B0000;
        box-shadow: 
          inset 0 0 25px rgba(139, 0, 0, 0.25),
          0 0 25px rgba(139, 0, 0, 0.15),
          0 8px 32px rgba(0, 0, 0, 0.6),
          0 4px 8px rgba(0, 0, 0, 0.8);
        animation: slideIn 0.6s ease-out, rustPulse 4s ease-in-out infinite;
        position: relative;
        
        /* 2D beveled edge effect */
        &::before {
          content: '';
          position: absolute;
          top: -3px;
          left: -3px;
          right: -3px;
          bottom: -3px;
          background: 
            linear-gradient(45deg, #660000 0%, #FF0000 25%, #660000 50%, #FF0000 75%, #660000 100%),
            linear-gradient(-45deg, #440000 0%, #8B0000 25%, #440000 50%, #8B0000 75%, #440000 100%);
          background-size: 20px 20px, 20px 20px;
          z-index: -1;
          opacity: 0.8;
        }
        
        /* Inner highlight for 2D depth */
        &::after {
          content: '';
          position: absolute;
          top: 2px;
          left: 2px;
          right: 2px;
          bottom: 2px;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 50%);
          border-radius: 2px;
          pointer-events: none;
          z-index: 1;
        }
      }
      
      h1, h2, h3 { margin-top: 0; }
      h1 { 
        font-size: 3rem; 
        font-weight: 900; 
        margin-bottom: 8px; 
        color: #FF0000;
        text-transform: uppercase;
        letter-spacing: 3px;
        animation: glitch 2s infinite;
      }
      h2 { 
        font-size: 2rem; 
        font-weight: 700;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      h3 { 
        font-size: 1.5rem; 
        font-weight: 600; 
        margin-top: 24px;
        color: #ffffff;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      input, button {
        font-family: 'Courier New', monospace;
        font-size: 14px;
        font-weight: 600;
        padding: 14px 24px;
        border-radius: 20px;
        border: 2px solid #8B0000;
        background: 
          linear-gradient(135deg, #5a0000, #3a0000),
          linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
        color: #f0f0f0;
        transition: all 0.2s ease;
        box-shadow: 
          inset 0 2px 4px rgba(0, 0, 0, 0.8),
          inset 0 -2px 4px rgba(139, 0, 0, 0.3),
          0 4px 8px rgba(0, 0, 0, 0.6),
          0 2px 4px rgba(0, 0, 0, 0.8);
        position: relative;
        
        /* 2D button highlight */
        &::before {
          content: '';
          position: absolute;
          top: 1px;
          left: 1px;
          right: 1px;
          bottom: 1px;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 40%);
          border-radius: 18px;
          pointer-events: none;
          z-index: 1;
        }
      }
      input:focus { 
        outline: none; 
        border-color: #FF0000; 
        box-shadow: 
          inset 0 2px 4px rgba(0, 0, 0, 0.8),
          inset 0 -2px 4px rgba(255, 0, 0, 0.4),
          0 0 0 3px rgba(255, 0, 0, 0.2),
          0 4px 8px rgba(0, 0, 0, 0.6);
      }
      
      button {
        background: 
          linear-gradient(135deg, #7a0000, #4a0000),
          linear-gradient(180deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
        border: 2px solid #FF0000;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        box-shadow: 
          inset 0 2px 4px rgba(0, 0, 0, 0.8),
          inset 0 -2px 4px rgba(255, 0, 0, 0.3),
          0 4px 8px rgba(0, 0, 0, 0.6),
          0 2px 4px rgba(0, 0, 0, 0.8),
          0 0 15px rgba(255, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
      }
      button:hover:not([disabled]) { 
        transform: translateY(-2px); 
        box-shadow: 
          inset 0 2px 4px rgba(0, 0, 0, 0.8),
          inset 0 -2px 4px rgba(255, 0, 0, 0.4),
          0 6px 12px rgba(255, 0, 0, 0.3),
          0 8px 16px rgba(0, 0, 0, 0.8),
          0 0 15px rgba(255, 0, 0, 0.3);
        filter: brightness(1.2);
      }
      button:active:not([disabled]) { 
        transform: translateY(0); 
        box-shadow: 
          inset 0 1px 2px rgba(0, 0, 0, 0.8),
          inset 0 -1px 2px rgba(255, 0, 0, 0.4),
          0 2px 4px rgba(0, 0, 0, 0.6);
      }
      button[disabled] { 
        opacity: 0.4; 
        cursor: not-allowed;
        filter: grayscale(0.8);
        background: linear-gradient(135deg, #4a4a4a, #2a2a2a);
        border-color: #666666;
      }
      
      .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      
      .scores {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: nowrap;
        overflow-x: auto;
      }
      .scores > * {
        flex: 1;
        min-width: 180px;
      }
      
      .pill {
        background: 
          linear-gradient(135deg, #3d3d3d, #2d2d2d),
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 8px,
            rgba(139, 0, 0, 0.08) 8px,
            rgba(139, 0, 0, 0.08) 9px
          ),
          linear-gradient(180deg, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
        border: 2px solid #8B0000;
        padding: 16px;
        border-radius: 4px;
        transition: all 0.2s ease;
        animation: slideIn 0.4s ease-out;
        box-shadow: 
          inset 0 0 20px rgba(139, 0, 0, 0.15),
          0 4px 8px rgba(0, 0, 0, 0.6),
          0 2px 4px rgba(0, 0, 0, 0.8);
        position: relative;
        
        /* 2D beveled edge */
        &::before {
          content: '';
          position: absolute;
          top: -2px;
          left: -2px;
          right: -2px;
          bottom: -2px;
          background: 
            linear-gradient(45deg, #660000 0%, #FF0000 25%, #660000 50%, #FF0000 75%, #660000 100%),
            linear-gradient(-45deg, #440000 0%, #8B0000 25%, #440000 50%, #8B0000 75%, #440000 100%);
          background-size: 10px 10px, 10px 10px;
          z-index: -1;
          opacity: 0.7;
        }
        
        /* Inner highlight */
        &::after {
          content: '';
          position: absolute;
          top: 1px;
          left: 1px;
          right: 1px;
          bottom: 1px;
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 40%);
          border-radius: 2px;
          pointer-events: none;
          z-index: 1;
        }
      }
      .pill:hover { 
        transform: translateY(-2px); 
        box-shadow: 
          inset 0 0 25px rgba(139, 0, 0, 0.3),
          0 6px 12px rgba(139, 0, 0, 0.2),
          0 8px 16px rgba(0, 0, 0, 0.8);
        filter: brightness(1.1);
      }
      
      .winner {
        background: 
          linear-gradient(135deg, rgba(139, 0, 0, 0.3), #2d2d2d),
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 6px,
            rgba(255, 0, 0, 0.2) 6px,
            rgba(255, 0, 0, 0.2) 7px
          );
        border: 2px solid #FF0000;
        animation: celebrate 0.6s ease-in-out, rustPulse 2s ease-in-out infinite;
        box-shadow: 
          inset 0 0 30px rgba(255, 0, 0, 0.4),
          0 0 20px rgba(255, 0, 0, 0.3),
          0 8px 16px rgba(0, 0, 0, 0.8);
      }
      
      .danger { color: #FF0000; font-weight: 600; text-shadow: 0 0 8px rgba(255, 0, 0, 0.5); }
      .strike { text-decoration: line-through; opacity: 0.5; }
      .center { display: flex; justify-content: center; align-items: center; flex-direction: column; }
      .big { font-size: 2rem; font-weight: 700; }
      .muted { color: #9ca3af; }
      
      code {
        font-family: 'Courier New', monospace;
        background: 
          linear-gradient(135deg, rgba(139, 0, 0, 0.2), #2d2d2d),
          repeating-linear-gradient(
            90deg,
            transparent,
            transparent 4px,
            rgba(255, 0, 0, 0.1) 4px,
            rgba(255, 0, 0, 0.1) 5px
          );
        padding: 8px 16px;
        border-radius: 4px;
        font-size: 1.2em;
        font-weight: 700;
        color: #FF0000;
        border: 1px solid #8B0000;
        text-shadow: 0 0 6px rgba(255, 0, 0, 0.6);
        box-shadow: 
          inset 0 1px 2px rgba(0, 0, 0, 0.8),
          inset 0 -1px 2px rgba(139, 0, 0, 0.3),
          0 2px 4px rgba(0, 0, 0, 0.6);
      }
      
      hr { 
        border: none; 
        border-top: 2px solid #8B0000; 
        margin: 24px 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, #FF0000, transparent);
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <canvas id="bg-canvas"></canvas>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Animated particle background for gaming feel
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
      
      const particles = [];
      const particleCount = 150; // More particles for intensity
      
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 3 + 0.5; // Varied sizes
          this.speedX = Math.random() * 1.5 - 0.75; // Faster movement
          this.speedY = Math.random() * 1.5 - 0.75;
          this.opacity = Math.random() * 0.6 + 0.1;
          // Mix of red and dark blue particles for killer mode
          this.color = Math.random() > 0.7 
            ? { r: 239, g: 68, b: 68 }   // Red particles (danger)
            : { r: 30, g: 58, b: 138 };   // Dark blue particles
        }
        
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          
          // Wrap around edges
          if (this.x > canvas.width) this.x = 0;
          if (this.x < 0) this.x = canvas.width;
          if (this.y > canvas.height) this.y = 0;
          if (this.y < 0) this.y = canvas.height;
          
          // Pulse effect
          this.opacity += Math.sin(Date.now() * 0.001) * 0.01;
        }
        
        draw() {
          ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
          
          // Add glow effect for red particles
          if (this.color.r > 200) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = `rgba(239, 68, 68, ${this.opacity * 0.5})`;
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      }
      
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
      
      function connectParticles() {
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 100) { // Shorter connection distance
              // Red connections for danger
              const isRedConnection = particles[i].color.r > 200 || particles[j].color.r > 200;
              const color = isRedConnection 
                ? `rgba(239, 68, 68, ${0.2 * (1 - distance / 100)})`
                : `rgba(59, 130, 246, ${0.1 * (1 - distance / 100)})`;
              
              ctx.strokeStyle = color;
              ctx.lineWidth = isRedConnection ? 1.5 : 0.5;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.stroke();
            }
          }
        }
      }
      
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(particle => {
          particle.update();
          particle.draw();
        });
        
        connectParticles();
        requestAnimationFrame(animate);
      }
      
      animate();
    </script>
  </body>
</html>
